name: 'Kaliyattam Theme'
type: theme
description: 'Native Drupal 11 sacred ritual arts theme with Single Directory Components (SDC), mobile-first responsive architecture, and zero jQuery.'
core_version_requirement: '^10.1 || ^11.0'
'base theme': false

libraries:
  - kaliyattam_subtheme/global-styling
  - kaliyattam_subtheme/navigation
  - kaliyattam_subtheme/post-composer

ckeditor_stylesheets:
  - css/tokens.css
  - css/base.css

ckeditor5-stylesheets:
  - css/tokens.css
  - css/base.css

regions:
  header: Header
  nav_branding: 'Navigation branding region'
  nav_main: 'Main navigation region'
  nav_additional: 'Additional navigation region (eg search form, social icons, etc)'
  breadcrumb: Breadcrumbs
  content: 'Main content'
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  footer: Footer

libraries-extend:
  core/drupal.dialog:
    - kaliyattam_subtheme/modal-dialog
    - kaliyattam_subtheme/post-composer

